<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 70%;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0055a5;
        }

        .thank-you {
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f5e9;
            text-align: center;
            border-radius: 8px;
            border: 1px solid #81c784;
        }

        .thank-you h3 {
            margin-top: 0;
            color: #2e7d32;
        }

        footer {
            text-align: center;
            background-color: #003366;
            color: white;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>VIT Vellore</h1>
    <h2>Student Feedback System</h2>
</header>

<div class="container">

    <h2>Submit Your Feedback</h2>

    <form>

        <label>Course Name</label>
        <input type="text" placeholder="Enter course name" required>

        <label>Faculty Name</label>
        <input type="text" placeholder="Enter faculty name" required>

        <label>Student Name</label>
        <input type="text" placeholder="Enter student name" required>

        <label>Register Number</label>
        <input type="text" placeholder="Enter register number" required>

        <label>Department</label>
        <select required>
            <option value="">Select Department</option>
            <option>Computer Science and Engineering</option>
            <option>Information Technology</option>
            <option>Data Science</option>
            <option>Electronics and Communication Engineering</option>
            <option>Mechanical Engineering</option>
        </select>

        <label>Rating</label>
        <select required>
            <option value="">Select Rating</option>
            <option>5 - Excellent</option>
            <option>4 - Very Good</option>
            <option>3 - Good</option>
            <option>2 - Average</option>
            <option>1 - Poor</option>
        </select>

        <label>Feedback / Comments</label>
        <textarea placeholder="Enter your feedback" required></textarea>

        <button type="submit">Submit Feedback</button>

    </form>

    <div class="thank-you">
        <h3>Thank You!</h3>
        <p>Thank you for taking the time to provide your valuable feedback.</p>
    </div>

</div>

<footer>
    Student Feedback System | VIT Vellore
</footer>

</body>
</html>
